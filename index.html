<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leikur</title>
  <style>
    :root { --bar: 64px; }
    html, body { margin: 0; height: 100%; background: #111; }
    body {
      display: flex; flex-direction: column; align-items: center;
      font-family: system-ui, "Segoe UI", sans-serif;
    }

    /* ---------- Verkfærastika ---------- */
    #toolbar {
      box-sizing: border-box;
      height: var(--bar);
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 10px;
      background: linear-gradient(#3a2718, #2a1c12);
      border-bottom: 2px solid #1a110a;
      user-select: none;
    }
    #toolbar .sep { width: 2px; align-self: stretch; margin: 4px 8px; background: #1a110a; border-radius: 1px; }
    #toolbar button {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      min-width: 70px; height: 100%;
      padding: 2px 8px;
      border: 2px solid #5a3d27; border-radius: 10px;
      background: #4a3220; color: #f3e6d6;
      font: 600 12px system-ui, "Segoe UI", sans-serif;
      cursor: pointer;
      transition: background .1s, transform .05s;
    }
    #toolbar button:hover { background: #5a3d27; }
    #toolbar button:active { transform: translateY(1px); }
    #toolbar button.active {
      background: #f3c74a; border-color: #ffe28a; color: #2a1c12;
      box-shadow: 0 0 0 2px #2a1c12, 0 0 10px #f3c74a88;
    }
    #toolbar button svg { width: 26px; height: 22px; }
    #toolbar .key {
      position: absolute; top: 2px; right: 4px;
      font-size: 9px; opacity: .6;
    }
    #toolbar .action { min-width: 64px; background: #2f4a3a; border-color: #3f6450; }
    #toolbar .action:hover { background: #3f6450; }
    #toolbar .action.danger { background: #5a2a26; border-color: #7a3a34; }
    #toolbar .action.danger:hover { background: #7a3a34; }

    /* Á mjóum skjá: bara myndir, enginn texti */
    @media (max-width: 640px) {
      #toolbar { gap: 4px; padding: 6px 4px; }
      #toolbar button { min-width: 40px; padding: 2px 4px; }
      #toolbar .label, #toolbar .key { display: none; }
      #toolbar .sep { margin: 4px 2px; }
    }

    #wrap { flex: 1; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
    canvas {
      max-width: 100vw;
      max-height: calc(100vh - var(--bar));
      max-height: calc(100dvh - var(--bar));
      aspect-ratio: 320 / 180;
      width: 100%;
      /* Spjaldtölva: fingurinn á að teikna, ekki skruna eða þysja */
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    html, body { overscroll-behavior: none; }
    #toolbar button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button data-tool="dominoes" title="Kubbar (1)">
      <span class="key">1</span>
      <svg viewBox="0 0 26 22"><g fill="#8fe3ff" stroke="#1a110a" stroke-width="1"><rect x="3" y="6" width="4" height="12" rx="1"/><rect x="11" y="6" width="4" height="12" rx="1"/><rect x="19" y="6" width="4" height="12" rx="1"/></g></svg>
      <span class="label">Kubbar</span>
    </button>
    <button data-tool="giant" title="Risakubbar (2)">
      <span class="key">2</span>
      <svg viewBox="0 0 26 22"><g fill="#ff8fd0" stroke="#1a110a" stroke-width="1"><rect x="3" y="12" width="3" height="8" rx="1"/><rect x="13" y="2" width="9" height="18" rx="1.5"/></g><line x1="13.5" y1="11" x2="21.5" y2="11" stroke="#1a110a"/><circle cx="17.5" cy="6.5" r="1.3" fill="#fff"/><circle cx="17.5" cy="15.5" r="1.3" fill="#fff"/></svg>
      <span class="label">Risakubbar</span>
    </button>
    <button data-tool="ball" title="Kúla (3)">
      <span class="key">3</span>
      <svg viewBox="0 0 26 22"><path d="M3 18 L10 12" stroke="#f3e6d6" stroke-dasharray="2 2"/><circle cx="16" cy="9" r="6" fill="#c8d0dc" stroke="#1a110a"/><circle cx="14" cy="7" r="2" fill="#fff"/></svg>
      <span class="label">Kúla</span>
    </button>
    <button data-tool="melon" title="Melóna (4)">
      <span class="key">4</span>
      <svg viewBox="0 0 26 22"><defs><clipPath id="mc"><circle cx="13" cy="11" r="8"/></clipPath></defs><circle cx="13" cy="11" r="8" fill="#3fa34d"/><g clip-path="url(#mc)" fill="#1e6b2c"><rect x="7" y="2" width="2" height="18"/><rect x="12" y="2" width="2" height="18"/><rect x="17" y="2" width="2" height="18"/></g><circle cx="13" cy="11" r="8" fill="none" stroke="#1a110a"/><circle cx="10" cy="8" r="2" fill="#ffffff55"/></svg>
      <span class="label">Melóna</span>
    </button>
    <button data-tool="ramp" title="Rampur (5)">
      <span class="key">5</span>
      <svg viewBox="0 0 26 22"><path d="M1 19 L8 9 H18 L25 19 Z" fill="#d9b07c" stroke="#1a110a"/><path d="M1 19 L8 9 V19 Z M25 19 L18 9 V19 Z" fill="#9c7550"/><g fill="#8fe3ff" stroke="#1a110a" stroke-width=".6"><rect x="10" y="3" width="2" height="6"/><rect x="15" y="3" width="2" height="6"/></g></svg>
      <span class="label">Rampur</span>
    </button>
    <button data-tool="spinner" title="Skopparakringla (6)">
      <span class="key">6</span>
      <svg viewBox="0 0 26 22"><g stroke="none"><path d="M13 11 L13 3 A8 8 0 0 1 21 11 Z" fill="#e8463c"/><path d="M13 11 L21 11 A8 8 0 0 1 13 19 Z" fill="#ffd23f"/><path d="M13 11 L13 19 A8 8 0 0 1 5 11 Z" fill="#3fa7e8"/><path d="M13 11 L5 11 A8 8 0 0 1 13 3 Z" fill="#7be08a"/></g><circle cx="13" cy="11" r="8" fill="none" stroke="#1a110a"/><circle cx="13" cy="11" r="1.6" fill="#f3e6d6"/><path d="M22 4 a10 10 0 0 1 2 6" stroke="#f3e6d6" fill="none"/><path d="M24 10 l-2 -1.5 M24 10 l1.2 -2" stroke="#f3e6d6"/></svg>
      <span class="label">Skopparakringla</span>
    </button>
    <button data-tool="eraser" title="Strokleður (7)">
      <span class="key">7</span>
      <svg viewBox="0 0 26 22"><g transform="rotate(-35 13 11)" stroke="#1a110a" stroke-width="1"><rect x="4" y="7" width="9" height="8" rx="1" fill="#f3e6d6"/><rect x="13" y="7" width="10" height="8" rx="1" fill="#ff8f8f"/></g><path d="M3 20 h20" stroke="#f3e6d6" stroke-dasharray="2 2"/></svg>
      <span class="label">Strokleður</span>
    </button>

    <div class="sep"></div>

    <button class="action" data-action="knock" title="Fella fyrsta kubbinn (Bil)">
      <span class="key">Bil</span>
      <svg viewBox="0 0 26 22"><g fill="#f3e6d6"><rect x="4" y="4" width="4" height="14" rx="1" transform="rotate(30 6 18)"/><rect x="14" y="4" width="4" height="14" rx="1"/></g><path d="M20 11 h4 m-2 -2 l2 2 l-2 2" stroke="#f3e6d6" fill="none"/></svg>
      <span class="label">Fella</span>
    </button>
    <button class="action" data-action="reset" title="Reisa alla upp aftur (R)">
      <span class="key">R</span>
      <svg viewBox="0 0 26 22"><path d="M19 11 a6 6 0 1 1 -2 -4.5" stroke="#f3e6d6" stroke-width="2" fill="none"/><path d="M18 2 v5 h-5" stroke="#f3e6d6" stroke-width="2" fill="none"/></svg>
      <span class="label">Reisa</span>
    </button>
    <button class="action danger" data-action="clear" title="Hreinsa allt (C)">
      <span class="key">C</span>
      <svg viewBox="0 0 26 22"><g stroke="#f3e6d6" stroke-width="2" fill="none"><path d="M7 6 h12 M11 6 v-2 h4 v2"/><path d="M8.5 6 l1 13 h7 l1 -13"/></g></svg>
      <span class="label">Hreinsa</span>
    </button>
  </div>

  <div id="wrap">
    <canvas id="game" width="320" height="180"></canvas>
  </div>
  <script src="game.js"></script>
</body>
</html>
